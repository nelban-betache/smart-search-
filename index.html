<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Search Hub</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", system-ui, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #020617, #0f172a);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 500px;
    padding: 32px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(14px);
    box-shadow: 0 25px 45px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.container h2 {
    text-align: center;
    color: #fff;
    font-weight: 600;
    font-size: 28px;
    margin-bottom: 4px;
}

.container h3 {
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-weight: 400;
    font-size: 14px;
    margin-bottom: 8px;
}

/* Form */
.search-form {
    display: flex;
    gap: 12px;
    align-items: stretch;
}

.search-form input {
    flex: 1;
    padding: 16px 18px;
    border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.1);
    outline: none;
    font-size: 16px;
    background: rgba(255,255,255,0.12);
    color: #fff;
    transition: all 0.2s ease;
}

.search-form input:focus {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.3);
}

.search-form input::placeholder {
    color: rgba(255,255,255,0.6);
}

.search-form button {
    padding: 16px 24px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    min-width: 140px;
}

.search-form button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.search-form button:active {
    transform: scale(0.98);
}

.search-form button i {
    font-size: 18px;
}

/* Brand colors */
.youtube { background: linear-gradient(135deg, #ff0000, #cc0000); }
.google { background: linear-gradient(135deg, #4285F4, #1a73e8); }
.reddit { background: linear-gradient(135deg, #ff4500, #ff6a33); }
.github { background: linear-gradient(135deg, #333333, #000000); }
.pinterest { background: linear-gradient(135deg, #e60023, #b8001c); }

/* Floating Button */
.floating-container {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 999;
}

.floating-button {
    background: linear-gradient(135deg, #ffcc00, #ffaa00);
    color: #000;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    font-size: 26px;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 204, 0, 0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease;
}

.floating-button:hover {
    transform: translateY(-6px) scale(1.05);
    box-shadow: 0 10px 30px rgba(255, 204, 0, 0.5);
}

.floating-button:active {
    transform: translateY(-3px) scale(1);
}

/* Modal Overlay */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-overlay.active {
    display: flex;
}

/* Suggestion Form */
.suggestion-form {
    background: linear-gradient(135deg, #ffffff, #f8f9fa);
    padding: 32px;
    border-radius: 20px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: slideUp 0.3s ease;
    position: relative;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.suggestion-form h3 {
    color: #1a1a1a;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    color: #444;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
}

.suggestion-form input,
.suggestion-form textarea {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 2px solid #e0e0e0;
    outline: none;
    font-size: 15px;
    font-family: inherit;
    transition: all 0.2s ease;
    background: #fff;
}

.suggestion-form input:focus,
.suggestion-form textarea:focus {
    border-color: #ffcc00;
    box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.1);
}

.suggestion-form textarea {
    resize: vertical;
    min-height: 100px;
}

.form-buttons {
    display: flex;
    gap: 12px;
    margin-top: 24px;
}

.form-buttons button {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.2s ease;
}

.btn-send {
    background: linear-gradient(135deg, #4CAF50, #45a049);
    color: #fff;
}

.btn-send:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(76, 175, 80, 0.3);
}

.btn-cancel {
    background: #f5f5f5;
    color: #666;
}

.btn-cancel:hover {
    background: #e0e0e0;
    color: #333;
}

.form-buttons button:active {
    transform: scale(0.98);
}

/* Success Message */
.success-message {
    display: none;
    background: #4CAF50;
    color: white;
    padding: 16px;
    border-radius: 10px;
    text-align: center;
    margin-bottom: 16px;
    animation: slideDown 0.3s ease;
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile Optimizations */
@media (max-width: 768px) {
    .container {
        padding: 24px;
        max-width: 100%;
    }
    
    .container h2 {
        font-size: 24px;
    }
    
    .search-form {
        flex-direction: column;
        gap: 10px;
    }
    
    .search-form button {
        width: 100%;
        min-width: unset;
        padding: 16px;
    }
    
    .floating-container {
        bottom: 20px;
        right: 20px;
    }
    
    .floating-button {
        width: 56px;
        height: 56px;
        font-size: 22px;
    }
    
    .suggestion-form {
        padding: 24px;
        margin: 0 10px;
    }
    
    .form-buttons {
        flex-direction: column;
    }
}

/* Small mobile devices */
@media (max-width: 480px) {
    body {
        padding: 12px;
    }
    
    .container {
        padding: 20px;
        gap: 16px;
        border-radius: 20px;
    }
    
    .container h2 {
        font-size: 22px;
    }
    
    .search-form input {
        padding: 14px 16px;
        font-size: 15px;
    }
    
    .search-form button {
        padding: 14px;
        font-size: 15px;
    }
    
    .suggestion-form {
        padding: 20px;
    }
    
    .suggestion-form h3 {
        font-size: 20px;
    }
}

/* Desktop enhancements */
@media (min-width: 1024px) {
    .container {
        max-width: 550px;
        padding: 40px;
    }
    
    .search-form button {
        min-width: 150px;
    }
    
    .floating-button {
        width: 70px;
        height: 70px;
        font-size: 28px;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    * {
        animation: none !important;
        transition: none !important;
    }
}

/* Touch device optimizations */
@media (hover: none) and (pointer: coarse) {
    .search-form input,
    .search-form button,
    .suggestion-form input,
    .suggestion-form textarea,
    .form-buttons button {
        min-height: 48px; /* Minimum touch target size */
    }
}
/* Version */
.version {
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    font-weight: 400;
    margin-top: 8px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.1);
}
</style>

<body>

<div class="container">
    <h2>🚀 Smart Search Hub</h2>
    <h3>by nelbanXchatgpt</h3>

    <!-- YouTube -->
    <form action="https://www.youtube.com/results" method="get" class="search-form" target="_blank">
        <input name="search_query" placeholder="Search YouTube" required autocomplete="off">
        <button type="submit" class="youtube"><i class="fa-brands fa-youtube"></i>YouTube</button>
    </form>

    <!-- Google -->
    <form action="https://www.google.com/search" method="get" class="search-form" target="_blank">
        <input name="q" placeholder="Search Google" required autocomplete="off">
        <button type="submit" class="google"><i class="fa-brands fa-google"></i>Google</button>
    </form>

    <!-- Reddit -->
    <form action="https://www.reddit.com/search/" method="get" class="search-form" target="_blank">
        <input name="q" placeholder="Search Reddit" required autocomplete="off">
        <button type="submit" class="reddit"><i class="fa-brands fa-reddit-alien"></i>Reddit</button>
    </form>

    <!-- GitHub -->
    <form action="https://github.com/search" method="get" class="search-form" target="_blank">
        <input name="q" placeholder="Search GitHub" required autocomplete="off">
        <button type="submit" class="github"><i class="fa-brands fa-github"></i>GitHub</button>
    </form>

    <!-- Pinterest -->
    <form action="https://www.pinterest.com/search/pins/" method="get" class="search-form" target="_blank">
        <input name="q" placeholder="Search Pinterest" required autocomplete="off">
        <button type="submit" class="pinterest"><i class="fa-brands fa-pinterest"></i>Pinterest</button>
    </form>
    
    <!-- Version -->
<div class="version">Version 1.0.0.0</div>
</div>

    
<!-- Floating Suggestion Button -->
<div class="floating-container">
    <button class="floating-button" title="Send Suggestion" aria-label="Send Suggestion">
        <i class="fa-solid fa-lightbulb"></i>
    </button>
</div>

<!-- Modal Overlay with Suggestion Form -->
<div class="modal-overlay" id="modalOverlay">
    <div class="suggestion-form">
        <div class="success-message" id="successMessage">
            <i class="fa-solid fa-check-circle"></i> Thank you! Your suggestion has been sent.
        </div>
        
        <h3>💡 Suggest a Feature</h3>
        
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" placeholder="your.email@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="message">Your Suggestion</label>
            <textarea id="message" placeholder="Tell us about your feature idea or feedback..." required></textarea>
        </div>
        
        <div class="form-buttons">
            <button type="button" id="sendSuggestion" class="btn-send">
                <i class="fa-solid fa-paper-plane"></i> Send Suggestion
            </button>
            <button type="button" id="closeForm" class="btn-cancel">
                <i class="fa-solid fa-times"></i> Cancel
            </button>
        </div>
    </div>
</div>

<script>
// Refresh page when user navigates back to it
window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
        window.location.reload();
    }
});

// Clear all inputs on page load
window.addEventListener("pageshow", function () {
    document.querySelectorAll("input").forEach(input => {
        input.value = "";
    });
    document.querySelectorAll("textarea").forEach(textarea => {
        textarea.value = "";
    });
});

// Modal and form functionality
const floatingBtn = document.querySelector('.floating-button');
const modalOverlay = document.getElementById('modalOverlay');
const closeBtn = document.getElementById('closeForm');
const sendBtn = document.getElementById('sendSuggestion');
const successMessage = document.getElementById('successMessage');

// Open modal
floatingBtn.addEventListener('click', () => {
    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden'; // Prevent background scrolling
});

// Close modal
function closeModal() {
    modalOverlay.classList.remove('active');
    document.body.style.overflow = ''; // Restore scrolling
    successMessage.style.display = 'none';
}

closeBtn.addEventListener('click', closeModal);

// Close modal when clicking outside the form
modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) {
        closeModal();
    }
});

// Close modal with Escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
        closeModal();
    }
});

// Send suggestion via email
sendBtn.addEventListener('click', () => {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const message = document.getElementById('message').value.trim();

    // Validation
    if (!name || !email || !message) {
        alert("⚠️ Please fill in all fields!");
        return;
    }

    // Email validation
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        alert("⚠️ Please enter a valid email address!");
        return;
    }

    // Create mailto link with proper formatting
    const subject = encodeURIComponent(`Feature Suggestion from ${name}`);
    const body = encodeURIComponent(
        `Name: ${name}\n` +
        `Email: ${email}\n` +
        `\n--- Suggestion ---\n` +
        `${message}\n` +
        `\n-------------------\n` +
        `Sent from Smart Search Hub`
    );
    
    const mailto = `mailto:nelbanbetache@gmail.com?subject=${subject}&body=${body}`;

    // Try to open email client
    try {
        window.location.href = mailto;
        
        // Show success message
        successMessage.style.display = 'block';
        
        // Clear form fields
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('message').value = '';
        
        // Close modal after 2 seconds
        setTimeout(() => {
            closeModal();
        }, 2000);
        
    } catch (error) {
        alert("⚠️ Unable to open email client. Please email us directly at: nelbanbetache@gmail.com");
        console.error("Email error:", error);
    }
});

// Form field focus management for better mobile experience
const formInputs = document.querySelectorAll('.suggestion-form input, .suggestion-form textarea');
formInputs.forEach(input => {
    input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.01)';
    });
    
    input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
    });
});
</script>

</body>
</html>
