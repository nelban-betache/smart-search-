<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Search Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#020617,#0f172a);
            display:flex;justify-content:center;align-items:flex-start;
            padding:40px 20px;overflow-x:hidden;
        }

        .container{width:100%;max-width:540px;display:flex;flex-direction:column;gap:20px}

        .hub-header{
            text-align:center;padding:28px 32px 22px;border-radius:24px;
            background:rgba(255,255,255,0.06);backdrop-filter:blur(14px);
            box-shadow:0 25px 45px rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.08);
        }
        .hub-header h2{color:#fff;font-weight:700;font-size:28px;letter-spacing:-0.5px}
        .hub-header h3{color:rgba(255,255,255,0.45);font-weight:400;font-size:13px;margin-top:5px}

        /* Category cards */
        .category-card{
            border-radius:20px;background:rgba(255,255,255,0.05);
            backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.08);
            overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,0.3);
        }
        .category-header{
            display:flex;align-items:center;gap:10px;
            padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.07);
        }
        .category-icon{
            width:30px;height:30px;border-radius:8px;
            display:flex;align-items:center;justify-content:center;
            font-size:13px;color:#fff;flex-shrink:0;
        }
        .category-title{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}
        .category-count{margin-left:auto;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;opacity:.7}

        .cat-video    .category-icon{background:linear-gradient(135deg,#ff0000,#cc0000)}
        .cat-video    .category-title{color:#ff6b6b}
        .cat-video    .category-count{background:rgba(255,80,80,0.15);color:#ff6b6b}
        .cat-social   .category-icon{background:linear-gradient(135deg,#ff4500,#e03d00)}
        .cat-social   .category-title{color:#ff8c6b}
        .cat-social   .category-count{background:rgba(255,100,60,0.15);color:#ff8c6b}
        .cat-dev      .category-icon{background:linear-gradient(135deg,#555,#1a1a1a)}
        .cat-dev      .category-title{color:#94a3b8}
        .cat-dev      .category-count{background:rgba(148,163,184,0.15);color:#94a3b8}
        .cat-creative .category-icon{background:linear-gradient(135deg,#e60023,#b8001c)}
        .cat-creative .category-title{color:#fc6d7c}
        .cat-creative .category-count{background:rgba(230,0,35,0.15);color:#fc6d7c}

        .search-row{
            display:flex;gap:10px;align-items:center;
            padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);
            transition:background 0.15s ease;
        }
        .search-row:last-child{border-bottom:none}
        .search-row:hover{background:rgba(255,255,255,0.03)}
        .search-form{display:contents}

        .search-row input{
            flex:1;padding:12px 15px;border-radius:12px;
            border:2px solid rgba(255,255,255,0.1);outline:none;
            font-size:15px;background:rgba(255,255,255,0.09);
            color:#fff;transition:all 0.2s ease;
        }
        .search-row input:focus{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)}
        .search-row input::placeholder{color:rgba(255,255,255,0.45)}

        .search-row button{
            padding:12px 20px;border-radius:12px;border:none;
            font-size:14px;font-weight:700;color:#fff;
            display:flex;align-items:center;justify-content:center;gap:7px;
            cursor:pointer;transition:all 0.2s ease;white-space:nowrap;min-width:126px;
        }
        .search-row button:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 8px 20px rgba(0,0,0,0.4)}
        .search-row button:active{transform:scale(0.97)}
        .search-row button i{font-size:15px}

        .btn-youtube  {background:linear-gradient(135deg,#ff0000,#cc0000)}
        .btn-google   {background:linear-gradient(135deg,#4285F4,#1a73e8)}
        .btn-reddit   {background:linear-gradient(135deg,#ff4500,#e03d00)}
        .btn-github   {background:linear-gradient(135deg,#555,#111)}
        .btn-pinterest{background:linear-gradient(135deg,#e60023,#b8001c)}

        .version{text-align:center;color:rgba(255,255,255,0.25);font-size:12px;padding-bottom:16px}

        /* Floating */
        .floating-container{position:fixed;bottom:28px;right:28px;z-index:999}
        .floating-button{
            background:linear-gradient(135deg,#ffcc00,#ffaa00);color:#000;
            width:60px;height:60px;border-radius:50%;font-size:24px;border:none;
            cursor:pointer;box-shadow:0 6px 20px rgba(255,204,0,0.4);
            display:flex;justify-content:center;align-items:center;transition:all 0.3s ease;
        }
        .floating-button:hover{transform:translateY(-5px) scale(1.05);box-shadow:0 10px 30px rgba(255,204,0,0.5)}

        /* Modals */
        .modal-overlay{
            display:none;position:fixed;inset:0;
            background:rgba(0,0,0,0.65);backdrop-filter:blur(5px);
            z-index:1000;justify-content:center;align-items:center;padding:20px;
        }
        .modal-overlay.active{display:flex}

        /* Suggestion form */
        .suggestion-form{
            background:linear-gradient(135deg,#fff,#f8f9fa);
            padding:30px;border-radius:20px;width:100%;max-width:440px;
            box-shadow:0 20px 60px rgba(0,0,0,0.5);
            animation:slideUp 0.3s ease;
        }
        @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .suggestion-form h3{color:#1a1a1a;font-size:21px;font-weight:600;margin-bottom:18px;text-align:center}
        .form-group{margin-bottom:13px}
        .form-group label{display:block;color:#444;font-size:13px;font-weight:500;margin-bottom:6px}
        .suggestion-form input,.suggestion-form textarea{
            width:100%;padding:11px 14px;border-radius:10px;
            border:2px solid #e0e0e0;outline:none;font-size:14px;
            font-family:inherit;transition:all 0.2s ease;background:#fff;
        }
        .suggestion-form input:focus,.suggestion-form textarea:focus{border-color:#ffcc00;box-shadow:0 0 0 3px rgba(255,204,0,0.1)}
        .suggestion-form textarea{resize:vertical;min-height:88px}
        .form-buttons{display:flex;gap:10px;margin-top:18px}
        .form-buttons button{flex:1;padding:12px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:14px;transition:all 0.2s ease}
        .btn-send{background:linear-gradient(135deg,#4CAF50,#45a049);color:#fff}
        .btn-send:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(76,175,80,0.3)}
        .btn-cancel{background:#f0f0f0;color:#666}
        .btn-cancel:hover{background:#e0e0e0}

        /* ── PREVIEW POPUP ── */
        .results-overlay{
            display:none;position:fixed;inset:0;
            background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);
            z-index:2000;justify-content:center;align-items:center;padding:20px;
        }
        .results-overlay.active{display:flex}

        .results-popup{
            width:100%;max-width:520px;
            border-radius:24px;overflow:hidden;
            box-shadow:0 40px 100px rgba(0,0,0,0.8);
            background:#0d1424;
            border:1px solid rgba(255,255,255,0.1);
            animation:popIn 0.3s cubic-bezier(0.34,1.45,0.64,1);
        }
        @keyframes popIn{from{opacity:0;transform:scale(0.88) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}

        /* Popup banner */
        .popup-banner{
            padding:28px 28px 24px;
            display:flex;flex-direction:column;gap:6px;
            position:relative;
        }
        .popup-banner .close-x{
            position:absolute;top:16px;right:16px;
            width:32px;height:32px;border-radius:8px;border:none;
            background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);
            font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
            transition:all 0.2s ease;
        }
        .popup-banner .close-x:hover{background:rgba(255,80,80,0.25);color:#fff}

        .popup-platform{
            display:flex;align-items:center;gap:10px;margin-bottom:4px;
        }
        .popup-platform-icon{
            width:36px;height:36px;border-radius:10px;
            display:flex;align-items:center;justify-content:center;
            font-size:16px;color:#fff;flex-shrink:0;
        }
        .popup-platform-name{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,0.5)}
        .popup-query{
            font-size:22px;font-weight:700;color:#fff;
            line-height:1.3;word-break:break-word;
            padding-right:40px;
        }
        .popup-tip{font-size:13px;color:rgba(255,255,255,0.4);margin-top:2px}

        /* Info rows */
        .popup-info{
            padding:0 28px 20px;
            display:flex;flex-direction:column;gap:10px;
        }
        .info-row{
            display:flex;align-items:flex-start;gap:12px;
            padding:12px 14px;border-radius:12px;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.07);
        }
        .info-row i{font-size:14px;color:rgba(255,255,255,0.4);margin-top:1px;flex-shrink:0;width:16px;text-align:center}
        .info-row-text{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.5}
        .info-row-text strong{color:#fff;font-weight:600}

        /* Action buttons */
        .popup-actions{padding:0 28px 28px;display:flex;gap:10px}

        .btn-open-main{
            flex:1;padding:14px 20px;border-radius:14px;border:none;
            font-size:15px;font-weight:700;color:#fff;cursor:pointer;
            display:flex;align-items:center;justify-content:center;gap:9px;
            transition:all 0.2s ease;text-decoration:none;
        }
        .btn-open-main:hover{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 10px 28px rgba(0,0,0,0.5)}
        .btn-open-main:active{transform:scale(0.97)}
        .btn-open-main i{font-size:16px}

        .btn-copy{
            padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.15);
            background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.8);
            font-size:14px;cursor:pointer;
            display:flex;align-items:center;justify-content:center;gap:7px;
            transition:all 0.2s ease;white-space:nowrap;
        }
        .btn-copy:hover{background:rgba(255,255,255,0.13)}
        .btn-copy.copied{border-color:rgba(80,200,120,0.5);color:#6ee7a0;background:rgba(80,200,120,0.08)}

        /* Divider */
        .popup-divider{height:1px;background:rgba(255,255,255,0.07);margin:0 28px}

        @media(max-width:600px){
            body{padding:16px 12px}
            .search-row{flex-direction:column}
            .search-row button{width:100%;min-width:unset}
            .results-popup{border-radius:20px}
            .popup-banner{padding:22px 20px 18px}
            .popup-info{padding:0 20px 16px}
            .popup-actions{padding:0 20px 22px;flex-direction:column}
            .popup-query{font-size:19px}
            .floating-container{bottom:18px;right:18px}
            .form-buttons{flex-direction:column}
        }
        @media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
    </style>
</head>
<body>

<div class="container">
    <div class="hub-header">
        <h2>🚀 Smart Search Hub</h2>
        <h3>by: code with NLBN🥸</h3>
    </div>

    <!-- VIDEO -->
    <div class="category-card cat-video">
        <div class="category-header">
            <div class="category-icon"><i class="fa-solid fa-play"></i></div>
            <span class="category-title">Video</span>
            <span class="category-count">1 platform</span>
        </div>
        <div class="search-row">
            <form class="search-form"
                data-platform="YouTube" data-icon="fa-brands fa-youtube"
                data-url="https://www.youtube.com/results" data-param="search_query"
                data-color="linear-gradient(135deg,#ff0000,#cc0000)"
                data-tip="Search videos, shorts, channels & playlists"
                data-hint1="Results include videos, shorts, live streams and channels"
                data-hint2="Try adding a year or 'tutorial' to narrow results">
                <input placeholder="Search YouTube…" required autocomplete="off">
                <button type="submit" class="btn-youtube"><i class="fa-brands fa-youtube"></i>YouTube</button>
            </form>
        </div>
    </div>

    <!-- SOCIAL -->
    <div class="category-card cat-social">
        <div class="category-header">
            <div class="category-icon"><i class="fa-solid fa-users"></i></div>
            <span class="category-title">Social</span>
            <span class="category-count">2 platforms</span>
        </div>
        <div class="search-row">
            <form class="search-form"
                data-platform="Google" data-icon="fa-brands fa-google"
                data-url="https://www.google.com/search" data-param="q"
                data-color="linear-gradient(135deg,#4285F4,#1a73e8)"
                data-tip="Search the entire web"
                data-hint1="Results include web pages, images, news and more"
                data-hint2="Use quotes for exact phrases, e.g. \"best coffee shops\"">
                <input placeholder="Search Google…" required autocomplete="off">
                <button type="submit" class="btn-google"><i class="fa-brands fa-google"></i>Google</button>
            </form>
        </div>
        <div class="search-row">
            <form class="search-form"
                data-platform="Reddit" data-icon="fa-brands fa-reddit-alien"
                data-url="https://www.reddit.com/search/" data-param="q"
                data-color="linear-gradient(135deg,#ff4500,#e03d00)"
                data-tip="Search communities & discussions"
                data-hint1="Results include posts, comments and subreddits"
                data-hint2="Add 'subreddit:' to search within a specific community">
                <input placeholder="Search Reddit…" required autocomplete="off">
                <button type="submit" class="btn-reddit"><i class="fa-brands fa-reddit-alien"></i>Reddit</button>
            </form>
        </div>
    </div>

    <!-- DEV -->
    <div class="category-card cat-dev">
        <div class="category-header">
            <div class="category-icon"><i class="fa-solid fa-code"></i></div>
            <span class="category-title">Dev</span>
            <span class="category-count">1 platform</span>
        </div>
        <div class="search-row">
            <form class="search-form"
                data-platform="GitHub" data-icon="fa-brands fa-github"
                data-url="https://github.com/search" data-param="q"
                data-color="linear-gradient(135deg,#555,#111)"
                data-tip="Search repositories, code & developers"
                data-hint1="Results include repos, issues, pull requests and users"
                data-hint2="Use 'language:python' or 'stars:>1000' to filter">
                <input placeholder="Search GitHub…" required autocomplete="off">
                <button type="submit" class="btn-github"><i class="fa-brands fa-github"></i>GitHub</button>
            </form>
        </div>
    </div>

    <!-- CREATIVE -->
    <div class="category-card cat-creative">
        <div class="category-header">
            <div class="category-icon"><i class="fa-solid fa-palette"></i></div>
            <span class="category-title">Creative</span>
            <span class="category-count">1 platform</span>
        </div>
        <div class="search-row">
            <form class="search-form"
                data-platform="Pinterest" data-icon="fa-brands fa-pinterest"
                data-url="https://www.pinterest.com/search/pins/" data-param="q"
                data-color="linear-gradient(135deg,#e60023,#b8001c)"
                data-tip="Search visual inspiration & ideas"
                data-hint1="Results include pins, boards and idea collections"
                data-hint2="Be descriptive — try colours, styles or moods">
                <input placeholder="Search Pinterest…" required autocomplete="off">
                <button type="submit" class="btn-pinterest"><i class="fa-brands fa-pinterest"></i>Pinterest</button>
            </form>
        </div>
    </div>

    <div class="version">Version 3.0.0</div>
</div>

<!-- Floating button -->
<div class="floating-container">
    <button class="floating-button" title="Send Suggestion" aria-label="Send Suggestion">
        <i class="fa-solid fa-lightbulb"></i>
    </button>
</div>

<!-- Suggestion modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="suggestion-form">
        <h3>💡 Suggest for future updates</h3>
        <div class="form-group">
            <label>Your Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label>Your Email</label>
            <input type="email" id="email" placeholder="your.email@example.com">
        </div>
        <div class="form-group">
            <label>Your Suggestion</label>
            <textarea id="message" placeholder="Tell us about your feature idea or feedback..."></textarea>
        </div>
        <div class="form-buttons">
            <button type="button" id="sendSuggestion" class="btn-send"><i class="fa-solid fa-paper-plane"></i> Send Suggestion</button>
            <button type="button" id="closeForm" class="btn-cancel"><i class="fa-solid fa-times"></i> Cancel</button>
        </div>
    </div>
</div>

<!-- Preview popup -->
<div class="results-overlay" id="resultsOverlay">
    <div class="results-popup">

        <div class="popup-banner" id="popupBanner">
            <button class="close-x" id="closeResults"><i class="fa-solid fa-xmark"></i></button>
            <div class="popup-platform">
                <div class="popup-platform-icon" id="popupPlatformIcon"></div>
                <span class="popup-platform-name" id="popupPlatformName"></span>
            </div>
            <div class="popup-query" id="popupQuery"></div>
            <div class="popup-tip" id="popupTip"></div>
        </div>

        <div class="popup-divider"></div>

        <div class="popup-info">
            <div class="info-row">
                <i class="fa-solid fa-layer-group"></i>
                <div class="info-row-text" id="infoHint1"></div>
            </div>
            <div class="info-row">
                <i class="fa-solid fa-lightbulb"></i>
                <div class="info-row-text" id="infoHint2"></div>
            </div>
        </div>

        <div class="popup-actions">
            <a class="btn-open-main" id="openMainBtn" href="#" target="_blank" rel="noopener">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                <span id="openMainLabel">Open results</span>
            </a>
            <button class="btn-copy" id="copyLinkBtn">
                <i class="fa-solid fa-link"></i> Copy link
            </button>
        </div>

    </div>
</div>

<script>
window.addEventListener("pageshow", e => { if (e.persisted) window.location.reload(); });
window.addEventListener("pageshow", () => {
    document.querySelectorAll("input, textarea").forEach(el => el.value = "");
});

let currentUrl = "";

const resultsOverlay   = document.getElementById("resultsOverlay");
const popupBanner      = document.getElementById("popupBanner");
const popupPlatformIcon= document.getElementById("popupPlatformIcon");
const popupPlatformName= document.getElementById("popupPlatformName");
const popupQuery       = document.getElementById("popupQuery");
const popupTip         = document.getElementById("popupTip");
const infoHint1        = document.getElementById("infoHint1");
const infoHint2        = document.getElementById("infoHint2");
const openMainBtn      = document.getElementById("openMainBtn");
const openMainLabel    = document.getElementById("openMainLabel");
const copyLinkBtn      = document.getElementById("copyLinkBtn");
const closeResultsBtn  = document.getElementById("closeResults");

function openPreview(platform, color, iconClass, query, url, tip, hint1, hint2) {
    currentUrl = url;

    popupBanner.style.background = color;
    popupPlatformIcon.innerHTML = `<i class="${iconClass}" style="font-size:18px"></i>`;
    popupPlatformName.textContent = platform;
    popupQuery.textContent = `"${query}"`;
    popupTip.textContent = tip;
    infoHint1.innerHTML = hint1;
    infoHint2.innerHTML = hint2;
    openMainBtn.href = url;
    openMainBtn.style.background = color;
    openMainLabel.textContent = `Open in ${platform}`;

    copyLinkBtn.classList.remove("copied");
    copyLinkBtn.innerHTML = `<i class="fa-solid fa-link"></i> Copy link`;

    resultsOverlay.classList.add("active");
    document.body.style.overflow = "hidden";
}

function closePreview() {
    resultsOverlay.classList.remove("active");
    document.body.style.overflow = "";
}

closeResultsBtn.addEventListener("click", closePreview);
resultsOverlay.addEventListener("click", e => { if (e.target === resultsOverlay) closePreview(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && resultsOverlay.classList.contains("active")) closePreview(); });

copyLinkBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(currentUrl).then(() => {
        copyLinkBtn.classList.add("copied");
        copyLinkBtn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
        setTimeout(() => {
            copyLinkBtn.classList.remove("copied");
            copyLinkBtn.innerHTML = `<i class="fa-solid fa-link"></i> Copy link`;
        }, 2000);
    }).catch(() => {
        // fallback
        const ta = document.createElement("textarea");
        ta.value = currentUrl;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        copyLinkBtn.classList.add("copied");
        copyLinkBtn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
        setTimeout(() => {
            copyLinkBtn.classList.remove("copied");
            copyLinkBtn.innerHTML = `<i class="fa-solid fa-link"></i> Copy link`;
        }, 2000);
    });
});

document.querySelectorAll(".search-form").forEach(form => {
    form.addEventListener("submit", function(e) {
        e.preventDefault();
        const input = form.querySelector("input");
        const query = input.value.trim();
        if (!query) return;
        const url = `${form.dataset.url}?${form.dataset.param}=${encodeURIComponent(query)}`;
        openPreview(
            form.dataset.platform,
            form.dataset.color,
            form.dataset.icon,
            query, url,
            form.dataset.tip,
            form.dataset.hint1,
            form.dataset.hint2
        );
    });
});

// Suggestion modal
const modalOverlay = document.getElementById("modalOverlay");
const floatingBtn  = document.querySelector(".floating-button");
const closeBtn     = document.getElementById("closeForm");
const sendBtn      = document.getElementById("sendSuggestion");
const nameInput    = document.getElementById("name");
const emailInput   = document.getElementById("email");
const messageInput = document.getElementById("message");

const openModal  = () => { modalOverlay.classList.add("active"); document.body.style.overflow="hidden"; };
const closeModal = () => { modalOverlay.classList.remove("active"); document.body.style.overflow=""; };
const isValidEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

function sendSuggestion() {
    const name=nameInput.value.trim(), email=emailInput.value.trim(), message=messageInput.value.trim();
    if (!name||!email||!message){Swal.fire({icon:"warning",title:"Missing Information",text:"Please fill in all fields!",confirmButtonColor:"#ffcc00"});return}
    if (!isValidEmail(email)){Swal.fire({icon:"error",title:"Invalid Email",text:"Please enter a valid email address!",confirmButtonColor:"#ffcc00"});return}
    const subject=encodeURIComponent("Product Feedback | Smart Search Hub");
    const body=encodeURIComponent(`SMART SEARCH HUB – PRODUCT FEEDBACK\n==================================\n\nSubmitted By:\n• Name  : ${name}\n• Email : ${email}\n\nFeedback Details:\n${message}\n\n==================================\nGenerated automatically via Smart Search Hub\n`);
    try {
        window.location.href=`mailto:nelbanbetache@gmail.com?subject=${subject}&body=${body}`;
        Swal.fire({icon:"success",title:"Success!",text:"Your suggestion has been sent. Thank you!",confirmButtonColor:"#4CAF50",timer:3000,timerProgressBar:true})
            .then(()=>{nameInput.value="";emailInput.value="";messageInput.value="";closeModal();});
    } catch(err) {
        Swal.fire({icon:"error",title:"Error",html:"Unable to open email client.<br>Please email us directly at:<br><strong>nelbanbetache@gmail.com</strong>",confirmButtonColor:"#ffcc00"});
    }
}

floatingBtn.addEventListener("click", openModal);
closeBtn.addEventListener("click", closeModal);
sendBtn.addEventListener("click", sendSuggestion);
modalOverlay.addEventListener("click", e => { if (e.target===modalOverlay) closeModal(); });
document.addEventListener("keydown", e => { if (e.key==="Escape"&&modalOverlay.classList.contains("active")) closeModal(); });
</script>
</body>
</html>
